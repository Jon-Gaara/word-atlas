name: Android APK

# Builds a sideloadable debug APK with the whole atlas (illustrations, audio,
# sfx) bundled in. The APK goes to a GitHub Release, not a workflow artifact:
# the free plan allows only 500 MB of artifacts and this APK is ~640 MB, while
# a release asset can be up to 2 GB. Manual runs replace the "apk-latest" release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0"

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Read app version
        id: version
        run: echo "name=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Check APK
        id: apk
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$apk"
          echo "size=$(du -h "$apk" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "$apk" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish rolling APK release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.name }}
          APK_SIZE: ${{ steps.apk.outputs.size }}
          APK_SHA: ${{ steps.apk.outputs.sha }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          {
            echo "手动触发的构建，提交 ${GITHUB_SHA:0:7}"
            echo
            echo "- 版本 $APP_VERSION"
            echo "- 大小 $APK_SIZE"
            echo "- SHA-256 $APK_SHA"
            echo
            echo "下载 app-debug.apk 后传到手机直接安装（需允许「安装未知来源应用」）。"
          } > notes.md
          gh release create apk-latest \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --title "词光 APK 最新构建（$APP_VERSION）" \
            --notes-file notes.md

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: 词光 ${{ steps.version.outputs.name }}
          generate_release_notes: true
